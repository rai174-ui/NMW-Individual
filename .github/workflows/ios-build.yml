name: iOS Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_ios:
    name: Build iOS App
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        working-directory: artifacts/nutrimyway
        run: pnpm install

      - name: Build Web App
        working-directory: artifacts/nutrimyway
        run: pnpm run build:mobile

      - name: Sync Capacitor (iOS)
        working-directory: artifacts/nutrimyway
        run: npx cap sync ios

      - name: Build Unsigned iOS Archive (Verification)
        working-directory: artifacts/nutrimyway/ios/App
        run: |
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

